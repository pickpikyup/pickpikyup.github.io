<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global AI Weekly · 洞察存档</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d24;--sub:#5c6470;--line:#e5e8ee;--accent:#2471a3;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
  .topbar a{color:var(--sub);text-decoration:none;font-size:14px}
  .topbar a:hover{color:var(--accent)}
  h1{font-size:28px;margin:12px 0 4px}
  .desc{color:var(--sub);font-size:14px;margin-bottom:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0}
  .panel label{font-size:13px;font-weight:600;color:var(--sub);display:block;margin-bottom:8px}
  select{width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .go-btn{display:inline-block;margin-top:10px;padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
  .go-btn:hover{opacity:.9}
  ul.archive{list-style:none;margin-top:6px}
  ul.archive li{border-bottom:1px solid var(--line);padding:12px 2px}
  ul.archive li:last-child{border-bottom:none}
  ul.archive a{color:var(--ink);text-decoration:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
  ul.archive a:hover{color:var(--accent)}
  ul.archive .date{color:var(--sub);font-size:13px;white-space:nowrap}
  .empty{color:var(--sub);font-size:14px;text-align:center;padding:24px 0}
  .foot{color:var(--sub);font-size:12px;text-align:center;margin-top:32px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="/">← 返回博客首页</a>
    <a href="/about/">X Blog</a>
  </div>
  <h1>Global AI Weekly · 产业洞察</h1>
  <div class="desc">全球 AI 产业每周热点洞察 · 六大区域 × 八大 L 产业层级 · 数据可溯源</div>

  <div class="panel">
    <label for="issue">选择期次（按时间查看历史洞察）</label>
    <select id="issue"><option value="">加载中…</option></select>
    <button class="go-btn" id="goBtn">查看该期洞察 →</button>
  </div>

  <div class="panel">
    <label>全部历史期次</label>
    <ul class="archive" id="list"></ul>
  </div>

  <div class="foot">数据来源为公开可访问信源 · 每周更新 · 由 Hermes 自动生成</div>
</div>

<script>
// 【每期发布时在 ISSUES 数组顶部新增一行】格式：{date:"YYYY-MM-DD", title:"一句话标题"}
var ISSUES = [
  {date:"2026-09-06", title:"NVIDIA 收编 Hugging Face · OpenAI GPT-6 越狱安全事件 · 美国电网幽灵需求"}
];

var sel = document.getElementById('issue');
var list = document.getElementById('list');
function base(){ return location.pathname.replace(/\/[^/]*$/,'/'); }

function render(){
  sel.innerHTML = '';
  if(!ISSUES.length){ sel.innerHTML = '<option value="">暂无历史期次</option>'; list.innerHTML='<li class="empty">尚无存档期次</li>'; return; }
  sel.innerHTML = '<option value="">— 请选择要查看的期次 —</option>';
  ISSUES.slice().reverse().forEach(function(it){
    var o=document.createElement('option'); o.value=it.date; o.textContent=it.date+' · '+it.title; sel.appendChild(o);
  });
  list.innerHTML='';
  ISSUES.forEach(function(it){
    var li=document.createElement('li');
    var a=document.createElement('a');
    a.href=base()+it.date+'.html';
    a.innerHTML='<span>'+it.title+'</span><span class="date">'+it.date+'</span>';
    li.appendChild(a); list.appendChild(li);
  });
}
document.getElementById('goBtn').addEventListener('click', function(){
  if(sel.value){ location.href = base()+sel.value+'.html'; }
});
sel.addEventListener('change', function(){
  if(sel.value){ location.href = base()+sel.value+'.html'; }
});
render();
</script>
</body>
</html>
