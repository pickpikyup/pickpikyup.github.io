<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" style="width:100%;max-width:800px;display:block;margin:0 auto;border-radius:12px;">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="pipeWire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E86C1"/>
      <stop offset="100%" stop-color="#1B6DA8"/>
    </linearGradient>
    <linearGradient id="pipeBT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" fill="#8899aa" font-size="13" font-family="system-ui, sans-serif">有线耳机 vs AirPods · 数据带宽对比</text>

  <!-- Divider line -->
  <line x1="400" y1="60" x2="400" y2="340" stroke="#2a2a4e" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== LEFT SIDE: WIRED ===== -->
  <text x="200" y="90" text-anchor="middle" fill="#2E86C1" font-size="20" font-weight="700" font-family="system-ui, sans-serif">🎧 有线耳机（3.5mm）</text>
  <text x="200" y="112" text-anchor="middle" fill="#667788" font-size="11" font-family="system-ui, sans-serif">普通耳机 + 板载声卡</text>

  <!-- Thick pipe (wired) -->
  <rect x="55" y="135" width="290" height="42" rx="8" fill="#1a2a3e" stroke="#2E86C1" stroke-width="2"/>
  <rect x="55" y="135" width="290" height="42" rx="8" fill="url(#pipeWire)" opacity="0.8"/>
  <text x="200" y="148" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">1411 kbps</text>
  <text x="200" y="165" text-anchor="middle" fill="#ccddee" font-size="9" font-family="system-ui, sans-serif">无损 PCM · CD 级音质</text>

  <!-- Label below -->
  <text x="200" y="195" text-anchor="middle" fill="#2E86C1" font-size="11" font-weight="600" font-family="system-ui, sans-serif">数据量是 AirPods 的 5.5 倍</text>

  <!-- Specs -->
  <text x="60" y="228" fill="#8899aa" font-size="11" font-family="system-ui, sans-serif">✅ 零延迟 (&lt;1ms)</text>
  <text x="60" y="248" fill="#8899aa" font-size="11" font-family="system-ui, sans-serif">✅ 无损传输</text>
  <text x="60" y="268" fill="#8899aa" font-size="11" font-family="system-ui, sans-serif">✅ 高频完整保留</text>
  <text x="60" y="288" fill="#8899aa" font-size="11" font-family="system-ui, sans-serif">✅ ¥20-200 即可达到</text>

  <!-- ===== RIGHT SIDE: AIRPODS ===== -->
  <text x="600" y="90" text-anchor="middle" fill="#E74C3C" font-size="20" font-weight="700" font-family="system-ui, sans-serif">🎧 AirPods Pro</text>
  <text x="600" y="112" text-anchor="middle" fill="#667788" font-size="11" font-family="system-ui, sans-serif">AAC 蓝牙编码</text>

  <!-- Thin pipe (BT) -->
  <rect x="455" y="135" width="290" height="42" rx="8" fill="#1a2a3e" stroke="#E74C3C" stroke-width="2"/>
  <rect x="455" y="135" width="52" height="42" rx="8" fill="url(#pipeBT)" opacity="0.8"/>
  <text x="490" y="148" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">256</text>
  <text x="580" y="148" text-anchor="middle" fill="#667788" font-size="13" font-family="system-ui, sans-serif">kbps</text>
  <text x="600" y="165" text-anchor="middle" fill="#cc8888" font-size="9" font-family="system-ui, sans-serif">AAC 有损压缩 · 82% 数据被丢弃</text>

  <!-- Label below -->
  <text x="600" y="195" text-anchor="middle" fill="#E74C3C" font-size="11" font-weight="600" font-family="system-ui, sans-serif">带宽仅为有线的 18%</text>

  <!-- Specs -->
  <text x="460" y="228" fill="#8899aa" font-size="11" font-family="system-ui, sans-serif">❌ 延迟 100-200ms</text>
  <text x="460" y="248" fill="#8899aa" font-size="11" font-family="system-ui, sans-serif">❌ 82% 音频信息被丢弃</text>
  <text x="460" y="268" fill="#8899aa" font-size="11" font-family="system-ui, sans-serif">❌ 16kHz 以上高频被裁切</text>
  <text x="460" y="288" fill="#8899aa" font-size="11" font-family="system-ui, sans-serif">❌ ¥1500+ 仍无法避免</text>

  <!-- Bottom note -->
  <text x="400" y="340" text-anchor="middle" fill="#445566" font-size="10" font-family="system-ui, sans-serif">耳机单元再好，信号到了蓝牙这关就被砍掉 82% — 神仙也救不回来</text>
</svg>
