<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" style="width:100%;max-width:800px;display:block;margin:0 auto;border-radius:12px"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#16213e"/></linearGradient><linearGradient id="pipeWire" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#2E86C1"/><stop offset="100%" stop-color="#1B6DA8"/></linearGradient><linearGradient id="pipeBT" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#E74C3C"/><stop offset="100%" stop-color="#C0392B"/></linearGradient></defs><rect width="800" height="360" fill="url(#bg)" rx="12"/><text x="400" y="42" fill="#89a" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">有线耳机 vs AirPods · 数据带宽对比</text><line x1="400" x2="400" y1="60" y2="340" stroke="#2a2a4e" stroke-dasharray="4 4" stroke-width="1"/><text x="200" y="90" fill="#2E86C1" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">🎧 有线耳机（3.5mm）</text><text x="200" y="112" fill="#678" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">普通耳机 + 板载声卡</text><rect width="290" height="42" x="55" y="135" fill="#1a2a3e" stroke="#2E86C1" stroke-width="2" rx="8"/><rect width="290" height="42" x="55" y="135" fill="url(#pipeWire)" opacity=".8" rx="8"/><text x="200" y="148" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1411 kbps</text><text x="200" y="165" fill="#cde" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">无损 PCM · CD 级音质</text><text x="200" y="195" fill="#2E86C1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">数据量是 AirPods 的 5.5 倍</text><text x="60" y="228" fill="#89a" font-family="system-ui, sans-serif" font-size="11">✅ 零延迟 (&lt;1ms)</text><text x="60" y="248" fill="#89a" font-family="system-ui, sans-serif" font-size="11">✅ 无损传输</text><text x="60" y="268" fill="#89a" font-family="system-ui, sans-serif" font-size="11">✅ 高频完整保留</text><text x="60" y="288" fill="#89a" font-family="system-ui, sans-serif" font-size="11">✅ ¥20-200 即可达到</text><text x="600" y="90" fill="#E74C3C" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">🎧 AirPods Pro</text><text x="600" y="112" fill="#678" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">AAC 蓝牙编码</text><rect width="290" height="42" x="455" y="135" fill="#1a2a3e" stroke="#E74C3C" stroke-width="2" rx="8"/><rect width="52" height="42" x="455" y="135" fill="url(#pipeBT)" opacity=".8" rx="8"/><text x="490" y="148" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">256</text><text x="580" y="148" fill="#678" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">kbps</text><text x="600" y="165" fill="#c88" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">AAC 有损压缩 · 82% 数据被丢弃</text><text x="600" y="195" fill="#E74C3C" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">带宽仅为有线的 18%</text><text x="460" y="228" fill="#89a" font-family="system-ui, sans-serif" font-size="11">❌ 延迟 100-200ms</text><text x="460" y="248" fill="#89a" font-family="system-ui, sans-serif" font-size="11">❌ 82% 音频信息被丢弃</text><text x="460" y="268" fill="#89a" font-family="system-ui, sans-serif" font-size="11">❌ 16kHz 以上高频被裁切</text><text x="460" y="288" fill="#89a" font-family="system-ui, sans-serif" font-size="11">❌ ¥1500+ 仍无法避免</text><text x="400" y="340" fill="#456" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">耳机单元再好，信号到了蓝牙这关就被砍掉 82% — 神仙也救不回来</text></svg>